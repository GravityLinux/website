{{- $i := . -}}
{{- if eq $i "laptop" -}}
<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
  <rect x="11" y="6" width="42" height="27" rx="2"></rect>
  <path d="M4 37h56l-3 4H7z"></path>
</svg>
{{- else if eq $i "mini" -}}
<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
  <rect x="6" y="18" width="52" height="13" rx="3"></rect>
  <path d="M6 24h52"></path>
  <circle cx="49" cy="27.5" r="1" fill="currentColor" stroke="none"></circle>
</svg>
{{- else if eq $i "studio" -}}
<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
  <rect x="10" y="12" width="44" height="22" rx="3"></rect>
  <path d="M16 28h5M25 28h3"></path>
</svg>
{{- else if eq $i "imac" -}}
<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
  <rect x="8" y="4" width="48" height="29" rx="2"></rect>
  <path d="M28 33h8v6h-8zM20 41h24"></path>
</svg>
{{- else -}}
<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
  <rect x="10" y="8" width="44" height="28" rx="3"></rect>
</svg>
{{- end -}}
